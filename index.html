<title>Квесты дня</title>
<style>
:root{
  --bg:#161b2e; --surface:#1f2640; --surface2:#283052; --line:#343e66;
  --text:#ece9f4; --muted:#9ba2c2;
  --gold:#e9b44c; --gold-ink:#2b1f05;
  --moss:#7cc79a; --moss-ink:#0f2a1b; --moss-bg:rgba(124,199,154,.14);
  --blood:#d9645b;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef0f7; --surface:#ffffff; --surface2:#e4e8f4; --line:#cfd5ea;
    --text:#1d2340; --muted:#5b6385;
    --gold:#b97f12; --gold-ink:#ffffff;
    --moss:#2f8a58; --moss-ink:#ffffff; --moss-bg:rgba(47,138,88,.12);
    --blood:#b8443c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:18px 16px 110px}

.notice{background:var(--surface2);border-left:4px solid var(--blood);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}

/* Персонаж: единственный «громкий» элемент */
.hero{display:flex;align-items:center;gap:16px}
.lvl{flex:none;width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface)}
.lvl-n{font:700 44px/1 var(--serif);color:var(--gold)}
.lvl-w{font-size:12px;color:var(--muted);margin-top:2px}
.who h1{margin:0;font:700 26px/1.15 var(--serif)}
.who p{margin:2px 0 0;color:var(--muted)}
.bar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:var(--gold);transition:width .5s ease}
.xp{margin-top:16px;height:16px}
.hint{margin:6px 0 0;font-size:14px;color:var(--muted)}

.spheres{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sph{background:var(--surface);border-radius:12px;padding:10px 12px}
.sph-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.sph-top b{font-weight:600}
.sph-top span{color:var(--muted)}
.sph .bar{height:8px}
.sph .bar i{background:var(--moss)}

.streak{margin:16px 0 0;font-size:15px}
.streak b{font-weight:700}
.streak span{display:block;color:var(--muted);font-size:14px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px}
.day{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px;min-height:56px}
.day .wd{font-size:12px;color:var(--muted)}
.day .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid transparent;color:var(--muted);background:var(--surface)}
.day.part .num{border-color:var(--gold);color:var(--text)}
.day.win .num{background:var(--gold);color:var(--gold-ink);font-weight:700}
.day.sel{background:var(--surface2)}
.day.sel .wd{color:var(--text)}

h2{font:700 20px/1.2 var(--serif);margin:18px 0 4px}
.sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.sub.ok{color:var(--moss)}

.quest{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:64px;transition:background .2s,border-color .2s}
.quest .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.quest .chk svg{width:16px;height:16px;stroke:var(--moss-ink);stroke-width:3;fill:none;opacity:0}
.quest .qt{display:block;font-weight:600}
.quest .qs{display:block;font-size:13px;color:var(--muted)}
.quest .qx{font:700 15px var(--serif);color:var(--gold)}
.quest.done{background:var(--moss-bg);border-color:var(--moss)}
.quest.done .chk{background:var(--moss);border-color:var(--moss)}
.quest.done .chk svg{opacity:1}
.quest.done .qt{color:var(--muted)}
.empty{background:var(--surface);border-radius:14px;padding:16px;color:var(--muted)}

.boss{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.boss h3{margin:0 0 10px;font:700 18px/1.25 var(--serif)}
.boss .bar i{background:var(--blood)}
.boss p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.boss.dead{border-color:var(--gold)}
.boss.dead h3{color:var(--gold)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--gold);color:var(--gold-ink);min-height:48px}
.ghost{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.link{margin-top:22px;background:none;border:1px solid var(--line);border-radius:12px;color:var(--muted);width:100%;min-height:48px}

/* Тост и модалка */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;max-width:min(92vw,440px);font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(10,12,24,.7);display:none;align-items:center;justify-content:center;padding:24px;z-index:40}
#modal.open{display:flex}
.mcard{background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;text-align:center}
.mcard h2{margin:0 0 8px;color:var(--gold);font-size:26px}
.mcard p{margin:0 0 8px}
.mcard .btn{margin-top:14px}

/* Настройки */
#overlay{position:fixed;inset:0;background:rgba(10,12,24,.6);display:none;z-index:20}
#overlay.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h2{margin-top:6px}
.sheet h3{font:700 17px var(--serif);margin:22px 0 8px}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=number],.sheet select,.sheet textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.sheet textarea{min-height:110px;font:12px/1.4 ui-monospace,Menlo,monospace}
.qe{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.qe input{background:var(--bg)!important}
.qe-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.qe-row select{background:var(--bg)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.msg{font-size:14px;color:var(--muted);margin:8px 0 0;min-height:1.4em}
.danger{color:var(--blood);border-color:var(--blood)}

/* Дневник и подсказки */
.logbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.logbox label{display:block;font-size:14px;color:var(--muted);margin:2px 0 4px}
.logbox input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.logbox .row2{margin-top:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sleepline{margin:10px 0}
.logbox .sub{margin:10px 0 0}
.ramp{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface2);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:14px}
.ramp .ghost{flex:none}

/* Навигация */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
#nav button{border:0;background:none;min-height:58px;color:var(--muted);font-weight:600;border-top:3px solid transparent}
#nav button[aria-current="page"]{color:var(--gold);border-top-color:var(--gold)}

/* Страницы упражнений */
.ph{font:700 28px/1.15 var(--serif);margin:4px 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);padding:4px;border-radius:12px;margin:12px 0}
.seg button{border:0;background:none;border-radius:9px;padding:10px;min-height:44px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;color:var(--muted);font-weight:600}
.weeks button.on{border-color:var(--gold);color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 6px;font:700 17px var(--serif)}
.card p{margin:4px 0}
.card .meta{color:var(--muted);font-size:14px}
.bh{font:700 19px/1.25 var(--serif);margin:22px 0 2px}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.exc.done{border-color:var(--moss);background:var(--moss-bg)}
.exh{display:grid;grid-template-columns:54px 1fr}
.exchk{border:0;background:none;display:flex;align-items:center;justify-content:center;min-height:64px}
.exchk span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.exc.done .exchk span{background:var(--moss);border-color:var(--moss)}
.exchk svg{width:15px;height:15px;stroke:var(--moss-ink);stroke-width:3;fill:none;opacity:0}
.exc.done .exchk svg{opacity:1}
.extitle{border:0;background:none;text-align:left;padding:10px 12px 10px 0;display:block;width:100%}
.en{display:block;font-weight:600}
.ed{display:block;font-size:13px;color:var(--muted)}
.tag{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:400}
.exb{padding:2px 14px 14px;border-top:1px solid var(--line)}
.exb h4{font:700 15px var(--serif);margin:12px 0 4px}
.exb ol{margin:6px 0;padding-left:20px}
.exb li{margin:5px 0}
.exb p{margin:4px 0}
.note{border-left:4px solid var(--blood);background:var(--surface2);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.note.gold{border-left-color:var(--gold)}
.timer{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.timer .ghost{min-width:150px}
.timer .tm{font:700 18px var(--serif);color:var(--gold)}

/* Схемы упражнений */
.dg svg{width:100%;height:auto;display:block;background:var(--surface2);border-radius:10px;margin:12px 0 4px}
.dg .b,.dg .bad{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dg .bad{stroke:var(--blood)}
.dg .hd{fill:var(--text)}
.dg .hdb{fill:var(--blood)}
.dg .ho{fill:none;stroke:var(--text);stroke-width:3}
.dg .g{stroke:var(--muted);stroke-width:1.5}
.dg .gw{stroke:var(--muted);stroke-width:4}
.dg .ga{stroke:var(--gold);stroke-width:2.5;fill:none;stroke-linecap:round}
.dg .gd{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.dg .gh,.dg .dot{fill:var(--gold)}
.dg .wt{fill:var(--muted)}
.dg text{fill:var(--muted);font-size:10px;font-family:var(--sans)}

/* Графики */
.cbtn{border:0;background:none;color:var(--gold);width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin:-8px 0;border-radius:10px}
.cbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lab{display:flex;align-items:center;justify-content:space-between;gap:4px}
.lab label{margin:2px 0 4px}
.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.chart{width:100%;height:auto;display:block;margin:8px 0;background:var(--surface);border-radius:12px}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.chart .cl{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .cd{fill:var(--gold)}
.chart .goal{stroke:var(--moss);stroke-width:2;stroke-dasharray:6 4}
.chart .goalt{fill:var(--moss)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stats div{background:var(--surface);border-radius:10px;padding:8px 10px}
.stats b{display:block;font:700 17px var(--serif)}

/* ---------- названия, сон, дневник ---------- */
function qTitle(q){
  if (q.k === 'am') return 'Не трогать телефон ' + q.m + ' мин после подъёма';
  if (q.k === 'pm') return 'Телефон убран за ' + q.m + ' мин до сна';
  return q.t;
}

function toMin(v){
  if (!/^\d{2}:\d{2}$/.test(v || '')) return null;
  var p = v.split(':');
  return Number(p[0]) * 60 + Number(p[1]);
}

function sleepMin(l){
  if (!l) return null;
  var b = toMin(l.bed), w = toMin(l.wake);
  if (b === null || w === null) return null;
  var d = w - b;
  if (d < 0) d += 1440;
  return d === 0 ? null : d;
}

function hm(m){ return Math.floor(m / 60) + ' ч ' + pad(m % 60) + ' мин'; }
function sleepText(l){ var m = sleepMin(l); return m === null ? 'не посчитан' : hm(m); }
function num(v){ return String(v).replace('.', ','); }

function logSummary(){
  var tot = 0, cnt = 0, ws = [];
  for (var i = 6; i >= 0; i--) {
    var l = state.log[addDays(sel, -i)];
    if (!l) continue;
    var m = sleepMin(l);
    if (m !== null) { tot += m; cnt++; }
    if (l.w != null) ws.push(l.w);
  }
  var parts = [];
  if (cnt) parts.push('Сон за 7 дней: в среднем ' + hm(Math.round(tot / cnt)) + ' (записей: ' + cnt + ')');
  if (ws.length > 1) {
    var dl = Math.round((ws[ws.length - 1] - ws[0]) * 10) / 10;
    parts.push('вес ' + (dl > 0 ? '+' : '') + num(dl) + ' кг за период');
  } else if (ws.length === 1) {
    parts.push('вес ' + num(ws[0]) + ' кг');
  }
  var gt = goalText();
  if (gt) parts.push(gt.replace(/\.$/, ''));
  else if (ws.length) parts.push('Цель по весу можно задать в настройках');
  return parts.length ? parts.join('. ') + '.' : 'Сводка появится после первых записей.';
}

// Подсказка поднять ступень, если квест держится 5 дней из последних 7
function rampHints(){
  var t = todayStr(), html = '';
  state.quests.forEach(function(q){
    var r = RAMP[q.k];
    if (!r || q.m >= r.max) return;
    var c = 0;
    for (var i = 0; i < 7; i++) {
      var d = state.days[addDays(t, -i)];
      if (d && d.done && d.done[q.id]) c++;
    }
    if (c >= 5) {
      html += '<div class="ramp"><span>' + r.label + ': получается ' + c + ' дней из 7. Можно поднять ступень до ' +
        Math.min(r.max, q.m + r.step) + ' мин.</span>' +
        '<button class="ghost" data-a="ramp" data-id="' + esc(q.id) + '">Прибавить</button></div>';
    }
  });
  return html;
}

function csvText(){
  var dates = {};
  Object.keys(state.log).forEach(function(k){ dates[k] = 1; });
  Object.keys(state.days).forEach(function(k){
    var d = state.days[k];
    if (d && d.done && Object.keys(d.done).length) dates[k] = 1;
  });
  var vit = [], abs = [];
  state.quests.forEach(function(q){
    if (q.k === 'vit') vit.push(q.id);
    if (q.k === 'abs') abs.push(q.id);
  });
  function any(day, ids){
    return ids.some(function(id){ return day && day.done && day.done[id]; }) ? 1 : 0;
  }
  var rows = ['Дата;Лёг;Встал;Спал;Вес;Витамины;Пресс/спина;Подтягивания;Отжимания'];
  Object.keys(dates).sort().forEach(function(k){
    var l = state.log[k] || {}, day = state.days[k];
    var m = sleepMin(l);
    var p = k.split('-');
    rows.push([
      p[2] + '.' + p[1] + '.' + p[0], l.bed || '', l.wake || '',
      m === null ? '' : Math.floor(m / 60) + ':' + pad(m % 60),
      l.w != null ? num(l.w) : '', any(day, vit), any(day, abs),
      l.pu != null ? l.pu : '', l.ps != null ? l.ps : ''
    ].join(';'));
  });
  return rows.join('\n');
}

function migrate(o){
  var d = defaults();
  if (!o || typeof o !== 'object') return d;
  var quests = d.quests;
  if (Array.isArray(o.quests)) {
    quests = o.quests.slice(0, MAX_Q).map(function(q, i){
      var x = Number(q && q.x);
      var k = (q && KINDS.indexOf(q.k) >= 0) ? q.k : undefined;
      var item = {
        id: String((q && q.id) || ('q' + Date.now() + i)),
        t: String((q && q.t) || (k ? '' : 'Квест')),
        s: (q && q.s === 'body') ? 'body' : 'order',
        x: [5, 10, 15, 20].indexOf(x) >= 0 ? x : 10
      };
      if (k) item.k = k;
      if (RAMP[k]) item.m = Math.max(1, Math.min(RAMP[k].max, parseInt(q.m, 10) || RAMP[k].def));
      return item;
    });
  }
  var boss = d.boss;
  if (o.boss && typeof o.boss === 'object') {
    boss = {
      name: String(o.boss.name || d.boss.name),
      hp: Math.max(1, parseInt(o.boss.hp, 10) || d.boss.hp),
      start: /^\d{4}-\d{2}-\d{2}$/.test(o.boss.start || '') ? o.boss.start : d.boss.start,
      reward: String(o.boss.reward || '')
    };
  }
  return {
    v: 1,
    name: typeof o.name === 'string' ? o.name : d.name,
    quests: quests,
    days: (o.days && typeof o.days === 'object') ? o.days : {},
    log: (o.log && typeof o.log === 'object') ? o.log : {},
    ex: (o.ex && typeof o.ex === 'object') ? o.ex : {},
    res: (o.res && typeof o.res === 'object') ? o.res : {},
    goal: (o.goal && typeof o.goal === 'object') ? o.goal : {},
    ui: {
      dicMode: (o.ui && o.ui.dicMode === 'full') ? 'full' : 'pareto',
      posMode: (o.ui && o.ui.posMode === 'full') ? 'full' : 'pareto',
      dicWeek: (o.ui && [1, 2, 3, 4].indexOf(Number(o.ui.dicWeek)) >= 0) ? Number(o.ui.dicWeek) : 1
    },
    boss: boss
  };
}

/* ---------- расчёты ---------- */
function isWin(day){
  if (!day || !day.done) return false;
  var c = Object.keys(day.done).length;
  var n = Math.max(day.n || 0, c);
  return c > 0 && c >= Math.ceil(n * WIN_SHARE);
}

function levelInfo(xp, base, step){
  var l = 1, need = base, rest = xp;
  while (rest >= need) { rest -= need; l++; need = base + step * (l - 1); }
  return { level: l, into: rest, need: need };
}

function xpOf(){
  var tot = 0, sph = { body: 0, order: 0 };
  Object.keys(state.days).forEach(function(k){
    var day = state.days[k];
    if (!day || !day.done) return;
    Object.keys(day.done).forEach(function(id){
      var e = day.done[id];
      if (!e) return;
      tot += e.x;
      sph[e.s] = (sph[e.s] || 0) + e.x;
    });
    if (isWin(day)) tot += WIN_BONUS;
  });
  return { tot: tot, sph: sph };
}

function levels(){
  var x = xpOf();
  return {
    t: levelInfo(x.tot, 100, 50).level,
    body: levelInfo(x.sph.body || 0, 80, 40).level,
    order: levelInfo(x.sph.order || 0, 80, 40).level
  };
}

function firstDate(){
  var f = null;
  Object.keys(state.days).forEach(function(k){
    var d = state.days[k];
    if (d && d.done && Object.keys(d.done).length && (f === null || k < f)) f = k;
  });
  return f;
}

// Серия побед подряд. Один пропуск прощается (щит), не чаще раза в 7 дней.
function streakInfo(){
  var first = firstDate(), t = todayStr();
  if (!first) return { n: 0, shield: true };
  var todayWin = isWin(state.days[t]);
  var cur = todayWin ? t : addDays(t, -1);
  var age = todayWin ? 0 : 1;
  var n = 0, since = 99, forgiveAge = null;
  while (cur >= first) {
    if (isWin(state.days[cur])) { n++; since++; }
    else if (since >= 6) { since = 0; if (forgiveAge === null) forgiveAge = age; }
    else break;
    cur = addDays(cur, -1);
    age++;
  }
  return { n: n, shield: forgiveAge === null || forgiveAge >= 7 };
}

function bossInfo(){
  var b = state.boss, w = 0;
  Object.keys(state.days).forEach(function(k){
    if (k >= b.start && isWin(state.days[k])) w++;
  });
  var hp = Math.max(1, parseInt(b.hp, 10) || 1);
  return { wins: w, hp: hp, left: Math.max(0, hp - w) };
}

function allEx(p){
  var list = [];
  PROGRAMS[p].blocks.forEach(function(b){ b.ex.forEach(function(e){ list.push(e); }); });
  return list;
}

function paretoList(p){
  var all = allEx(p);
  return PROGRAMS[p].pareto.map(function(pe){
    var base = all.filter(function(e){ return e.id === pe.id; })[0];
    return Object.assign({}, base, pe);
  });
}

function getEx(p, id){
  var list = state.ui[p + 'Mode'] === 'pareto' ? paretoList(p) : allEx(p);
  return list.filter(function(e){ return e.id === id; })[0] || null;
}

function fmtSec(n){
  n = Math.max(0, Math.round(n));
  return Math.floor(n / 60) + ':' + pad(n % 60);
}

function buildSegs(e){
  var segs = [], sets = e.sets || 1, sides = e.sides ? ['правая сторона', 'левая сторона'] : [null];
  for (var s = 1; s <= sets; s++) {
    sides.forEach(function(side){
      var label = sets > 1 ? 'Подход ' + s + ' из ' + sets : 'Выполняйте';
      if (side) label += ', ' + side;
      segs.push({ label: label, sec: e.seconds });
    });
    if (s < sets && restOf(e)) segs.push({ label: 'Отдых', sec: restOf(e) });
  }
  return segs;
}

function totalSec(e){
  return buildSegs(e).reduce(function(a, g){ return a + g.sec; }, 0);
}

function progDays(p){
  var prefix = p === 'dic' ? 'd-' : 'p-', t = todayStr(), n = 0;
  for (var i = 0; i < 7; i++) {
    var m = state.ex[addDays(t, -i)];
    if (m && Object.keys(m).some(function(k){ return k.indexOf(prefix) === 0; })) n++;
  }
  return n;
}

function renderEx(p){
  var prog = PROGRAMS[p], mode = state.ui[p + 'Mode'], t = todayStr();
  var doneMap = state.ex[t] || {};
  var pareto = mode === 'pareto';
  var flat = pareto ? paretoList(p) : allEx(p);
  var cnt = flat.filter(function(e){ return doneMap[e.id]; }).length;

  var h = '<h1 class="ph">' + prog.title + '</h1><p class="sub">' + esc(prog.intro) + '</p>' +
    '<div class="seg" role="group" aria-label="Режим">' +

      '<button class="' + (!pareto ? 'on' : '') + '" data-a="mode" data-p="' + p + '" data-m="full" aria-pressed="' + !pareto + '">Полная</button>' +
    '</div>' +

      }).join('') + '</div>' +

      }).join('') +

  }

  if (pareto) {
    h += '<p class="sub">' + esc(prog.paretoInfo) + '</p>';
    flat.forEach(function(e){ h += exCard(p, e, !!doneMap[e.id]); });
  } else {
    if (prog.plan) {
      h += '<div class="card"><h3>План недели</h3>' + prog.plan.map(function(r){
        return '<p><b>' + esc(r[0]) + ': ' + esc(r[1]) + '.</b> ' + esc(r[2]) + '</p>';
      }).join('') + '</div>';
    }
    prog.blocks.forEach(function(b){
      h += '<h2 class="bh">' + esc(b.title) + '</h2><p class="sub">' + esc(b.intro) + '</p>';
      b.ex.forEach(function(e){ h += exCard(p, e, !!doneMap[e.id]); });
    });
  }
  h += '<p class="note">' + esc(prog.note) + '</p>';
  app.innerHTML = h;
  if (timer) tickTimer();
}

function initAudio(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !audio) audio = new AC();
    if (audio && audio.state === 'suspended') audio.resume();
  } catch (e) {}
}

function beep(freq, ms){
  try {
    if (!audio) return;
    var o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; g.gain.value = 0.08;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch (e) {}
}

function startTimer(p, id){
  var e = getEx(p, id);
  if (!e) return;
  clearInterval(timer);
  initAudio();
  var segs = buildSegs(e);
  timerId = id;
  timer = setInterval(tickTimer, 250);
  timerState = { p: p, id: id, segs: segs, start: Date.now(), total: segs.reduce(function(a, g){ return a + g.sec; }, 0), idx: 0 };
  renderMain();
}
var timerState = null;

function stopTimer(){
  clearInterval(timer);
  timer = null; timerId = null; timerState = null;
  renderMain();
}

function tickTimer(){
  if (!timerState) return;
  var ts = timerState;
  var el = (Date.now() - ts.start) / 1000;
  if (el >= ts.total) {
    clearInterval(timer);
    beep(880, 500);
    var t = todayStr();
    if (!state.ex[t]) state.ex[t] = {};
    state.ex[t][ts.id] = 1;
    save();
    timer = null; timerId = null; timerState = null;
    renderMain();
    toast('Готово: упражнение отмечено');
    return;
  }
  var acc = 0, idx = 0;
  for (var i = 0; i < ts.segs.length; i++) {
    if (el < acc + ts.segs[i].sec) { idx = i; break; }
    acc += ts.segs[i].sec;
  }
  if (idx !== ts.idx) { ts.idx = idx; beep(660, 200); }
  var node = document.getElementById('tm-' + ts.id);
  if (node) node.textContent = ts.segs[idx].label + ': ' + fmtSec(acc + ts.segs[idx].sec - el);
}

nav.addEventListener('click', function(e){
  var b = e.target.closest('[data-pg]');
  if (!b) return;
  page = b.getAttribute('data-pg');
  renderMain();
  window.scrollTo(0, 0);
});

}
function dayXp(day){
  if (!day || !day.done) return null;
  var s = 0;
  Object.keys(day.done).forEach(function(k){ var e = day.done[k]; if (e) s += e.x; });
  return s + (isWin(day) ? WIN_BONUS : 0);
}
function logVal(d, k){ var l = state.log[d]; return (l && l[k] != null) ? l[k] : null; }

var BASE_METRICS = {
  sleep:  { label: 'Сон', unit: 'ч', get: function(d){ var m = sleepMin(state.log[d]); return m === null ? null : m / 60; }, fmt: function(v){ return hm(Math.round(v * 60)); } },
  bed:    { label: 'Время отбоя', time: true, get: function(d){ var l = state.log[d], m = l ? toMin(l.bed) : null; if (m === null) return null; var h = m / 60; return h < 12 ? h + 24 : h; } },
  wake:   { label: 'Время подъёма', time: true, get: function(d){ var l = state.log[d], m = l ? toMin(l.wake) : null; return m === null ? null : m / 60; } },
  w:      { label: 'Вес', unit: 'кг', goal: true, get: function(d){ return logVal(d, 'w'); } },
  pu:     { label: 'Подтягивания', unit: 'раз', get: function(d){ return logVal(d, 'pu'); } },
  ps:     { label: 'Отжимания', unit: 'раз', get: function(d){ return logVal(d, 'ps'); } },
  quests: { label: 'Квестов за день', unit: 'шт', get: function(d){ var day = state.days[d]; return (day && day.done) ? Object.keys(day.done).length : null; } },
  xp:     { label: 'XP за день', unit: 'XP', get: function(d){ return dayXp(state.days[d]); } }
};

function metricExercises(){
  var out = [];
  ['dic', 'pos'].forEach(function(p){ allEx(p).forEach(function(e){ if (e.metric) out.push(e); }); });
  return out;
}

function metricDef(m){
  if (m.indexOf('r:') === 0) {
    var id = m.slice(2);
    var e = metricExercises().filter(function(x){ return x.id === id; })[0];
    if (!e) return null;
    return { label: e.metric.label, unit: e.metric.unit, get: function(d){ var r = state.res[d]; return (r && r[id] != null) ? r[id] : null; } };
  }
  return BASE_METRICS[m] || null;
}

function fmtVal(def, v){
  if (def.time) return clock(v);
  if (def.fmt) return def.fmt(v);
  return num(round1(v)) + (def.unit ? ' ' + def.unit : '');
}

function series(def, per){
  var t = todayStr(), pts = [], i, v;
  if (per === 'year') {
    var now = parseDate(t);
    for (i = 11; i >= 0; i--) {
      var first = new Date(now.getFullYear(), now.getMonth() - i, 1);
      var yy = first.getFullYear(), mm = first.getMonth(), days = new Date(yy, mm + 1, 0).getDate(), sum = 0, c = 0;
      for (var k = 1; k <= days; k++) {
        var key = ds(new Date(yy, mm, k));
        if (key > t) break;
        v = def.get(key);
        if (v != null && !isNaN(v)) { sum += v; c++; }
      }
      pts.push({ x: MON[mm], v: c ? sum / c : null });
    }
  } else {
    var n = per === 'week' ? 7 : 30;
    for (i = n - 1; i >= 0; i--) {
      var d = addDays(t, -i), dt = parseDate(d);
      v = def.get(d);
      pts.push({ x: per === 'week' ? WD[dt.getDay()] : String(dt.getDate()), v: (v == null || isNaN(v)) ? null : v });
    }
  }
  return pts;
}

function chartSvg(pts, def, goal){
  var vals = pts.map(function(p){ return p.v; }).filter(function(v){ return v != null; });
  if (!vals.length) return '<p class="meta">За этот период данных пока нет.</p>';
  var W = 320, H = 190, L = 44, R = 12, T = 14, B = 26;
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (goal != null) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  var padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  var n = pts.length;
  function xs(i){ return Math.round((L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1))) * 10) / 10; }
  function ys(v){ return Math.round((T + (hi - v) * (H - T - B) / (hi - lo)) * 10) / 10; }
  var g = '';
  for (var k = 0; k <= 3; k++) {
    var gv = lo + (hi - lo) * k / 3, y = ys(gv);
    var lab = def.time ? clock(gv) : num(round1(gv));
    g += '<line class="cg" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>' +
      '<text x="' + (L - 5) + '" y="' + (y + 3) + '" text-anchor="end">' + lab + '</text>';
  }
  var step = n > 12 ? 5 : 1;
  pts.forEach(function(p, i){
    if ((n - 1 - i) % step === 0) g += '<text x="' + xs(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(p.x) + '</text>';
  });
  if (goal != null) {
    g += '<line class="goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(goal) + '" y2="' + ys(goal) + '"/>' +
      '<text class="goalt" x="' + (W - R) + '" y="' + (ys(goal) - 4) + '" text-anchor="end">цель ' + num(goal) + '</text>';
  }
  var d = '', dots = '';
  pts.forEach(function(p, i){
    if (p.v == null) return;
    d += (d ? ' L' : 'M') + xs(i) + ',' + ys(p.v);
    dots += '<circle class="cd" cx="' + xs(i) + '" cy="' + ys(p.v) + '" r="3.5"/>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="График: ' + esc(def.label) + '">' +
    g + '<path class="cl" d="' + d + '"/>' + dots + '</svg>';
}

function chartHtml(){
  var def = metricDef(chartState.m) || BASE_METRICS.sleep;
  var per = chartState.per;
  var pts = series(def, per);
  var goal = (def.goal && state.goal.w != null) ? state.goal.w : null;
  var vals = pts.map(function(p){ return p.v; }).filter(function(v){ return v != null; });
  var opts = Object.keys(BASE_METRICS).map(function(k){ return [k, BASE_METRICS[k].label]; })
    .concat(metricExercises().map(function(e){ return ['r:' + e.id, e.metric.label]; }));
  var stats = '';
  if (vals.length) {
    var avg = vals.reduce(function(a, b){ return a + b; }, 0) / vals.length;
    stats = '<div class="stats">' +
      '<div><b>' + fmtVal(def, avg) + '</b><span>в среднем' + (per === 'year' ? ' (по месяцам)' : '') + '</span></div>' +
      '<div><b>' + fmtVal(def, vals[vals.length - 1]) + '</b><span>последнее значение</span></div>' +
      '<div><b>' + fmtVal(def, Math.min.apply(null, vals)) + '</b><span>минимум</span></div>' +
      '<div><b>' + fmtVal(def, Math.max.apply(null, vals)) + '</b><span>максимум</span></div>' +
      '</div>';
    if (goal != null) stats += '<p class="msg">' + esc(goalText()) + '</p>';
  }
  return '<div class="sheet">' +
    '<h2>График</h2>' +
    '<label for="c-metric">Показатель</label>' +
    '<select id="c-metric">' + opts.map(function(o){ return opt(o[0], esc(o[1]), chartState.m); }).join('') + '</select>' +
    '<div class="seg three" role="group" aria-label="Период">' +
      [['week', 'Неделя'], ['month', 'Месяц'], ['year', 'Год']].map(function(o){
        return '<button class="' + (per === o[0] ? 'on' : '') + '" data-a="cper" data-per="' + o[0] + '" aria-pressed="' + (per === o[0]) + '">' + o[1] + '</button>';
      }).join('') +
    '</div>' +
    chartSvg(pts, def, goal) + stats +
    (def.goal && goal == null ? '<p class="msg">Цель по весу задаётся в настройках.</p>' : '') +
    '<button class="btn" style="margin-top:16px" data-a="close">Закрыть</button>' +
    '</div>';
}

function openChart(m){
  if (!metricDef(m)) return;
  chartState.m = m;
  overlay.innerHTML = chartHtml();
  overlay.classList.add('open');
}

function latestWeight(){
  var keys = Object.keys(state.log).filter(function(k){ return state.log[k] && state.log[k].w != null; }).sort();
  return keys.length ? { first: state.log[keys[0]].w, last: state.log[keys[keys.length - 1]].w } : null;
}

function goalText(){
  var g = state.goal.w;
  if (g == null) return '';
  var lw = latestWeight();
  if (!lw) return 'Цель: ' + num(g) + ' кг.';
  var diff = round1(lw.last - g);
  var txt = 'Цель ' + num(g) + ' кг: ';
  if (Math.abs(diff) < 0.05) return txt + 'достигнута.';
  txt += (diff > 0 ? 'осталось сбросить ' : 'осталось набрать ') + num(Math.abs(diff)) + ' кг';
  if (Math.abs(lw.first - g) > 0.05) {
    var pct = Math.max(0, Math.min(1, (lw.first - lw.last) / (lw.first - g)));
    txt += ', пройдено ' + Math.round(pct * 100) + '% пути';
  }
  return txt + '.';
}

function setsText(e){
  return e.sets + ' ' + plural(e.sets, 'подход', 'подхода', 'подходов') + ' × ' + e.reps;
}
function restOf(e){ return e.rest != null ? e.rest : (e.id.indexOf('p-') === 0 ? 20 : 0); }

/* ---------- действия ---------- */
function toggle(date, id){
  var q = null;
  state.quests.forEach(function(item){ if (item.id === id) q = item; });
  if (!q) return;
  var before = levels();
  var bossBefore = bossInfo().left;
  var day = state.days[date] || (state.days[date] = { done: {}, n: 0 });
  if (!day.done) day.done = {};
  day.n = state.quests.length;
  var wasWin = isWin(day);
  var added;
  if (day.done[id]) { delete day.done[id]; added = false; }
  else { day.done[id] = { x: q.x, s: q.s }; added = true; }
  save();
  renderMain();

  var after = levels();
  var bossAfter = bossInfo().left;
  if (added) {
    var m = '+' + q.x + ' XP, ' + SPH[q.s];
    if (isWin(day) && !wasWin) m += '. Победный день: +' + WIN_BONUS + ' XP';
    toast(m);
  } else {
    toast('Отметка снята');
  }

  var lines = [];
  var title = '';
  if (bossBefore > 0 && bossAfter === 0) {
    title = 'Босс повержен';
    lines.push(state.boss.reward ? 'Награда: ' + state.boss.reward : 'Назначьте себе награду и нового босса в настройках.');
  }
  if (after.t > before.t) {
    if (!title) title = 'Уровень ' + after.t;
    lines.push('Новый уровень: ' + after.t + '. Титул: ' + titleFor(after.t));
  }
  ['body', 'order'].forEach(function(k){
    if (after[k] > before[k]) lines.push(SPH[k] + ': уровень ' + after[k]);
  });
  if (title) modal(title, lines);
  else if (lines.length) toast(lines.join('. '));
}

app.addEventListener('click', function(e){
  var b = e.target.closest('[data-a]');
  if (!b) return;
  var a = b.getAttribute('data-a');
  if (a === 'tog') toggle(sel, b.getAttribute('data-id'));
  else if (a === 'sel') { sel = b.getAttribute('data-d'); renderMain(); }
  else if (a === 'set') openSettings();
  else if (a === 'mode') {
    state.ui[b.getAttribute('data-p') + 'Mode'] = b.getAttribute('data-m') === 'full' ? 'full' : 'pareto';
    save(); renderMain();
  }
  else if (a === 'week') { state.ui.dicWeek = Number(b.getAttribute('data-w')) || 1; save(); renderMain(); }
  else if (a === 'ex-open') { var oid = b.getAttribute('data-id'); openEx[oid] = !openEx[oid]; renderMain(); }
  else if (a === 'ex-chk') {
    var cid = b.getAttribute('data-id'), ct = todayStr();
    if (!state.ex[ct]) state.ex[ct] = {};
    if (state.ex[ct][cid]) delete state.ex[ct][cid]; else state.ex[ct][cid] = 1;
    if (!Object.keys(state.ex[ct]).length) delete state.ex[ct];
    save(); renderMain();
    var flat = state.ui[page + 'Mode'] === 'pareto' ? paretoList(page) : allEx(page);
    var dm = state.ex[ct] || {};
    if (dm[cid] && flat.every(function(x){ return dm[x.id]; })) toast('Комплекс на сегодня выполнен');
  }
  else if (a === 'ex-timer') startTimer(page, b.getAttribute('data-id'));
  else if (a === 'ex-stop') stopTimer();
  else if (a === 'chart') openChart(b.getAttribute('data-m'));
  else if (a === 'ramp') {
    var rq = null;
    state.quests.forEach(function(item){ if (item.id === b.getAttribute('data-id')) rq = item; });
    if (rq && RAMP[rq.k]) {
      rq.m = Math.min(RAMP[rq.k].max, rq.m + RAMP[rq.k].step);
      save(); renderMain();
      toast('Новая ступень: ' + qTitle(rq));
    }
  }
});

// Дневник: сохраняем по завершении ввода, без перерисовки (чтобы не закрывался выбор времени)
app.addEventListener('change', function(e){
  var el = e.target, id = el.id || '';
  if (id.indexOf('r-') === 0) {
    var exid = id.slice(2), rt = todayStr();
    var rv = parseFloat(String(el.value || '').replace(',', '.'));
    if (!state.res[rt]) state.res[rt] = {};
    if (isNaN(rv) || rv < 0 || rv > 100000) delete state.res[rt][exid]; else state.res[rt][exid] = round1(rv);
    if (!Object.keys(state.res[rt]).length) delete state.res[rt];
    save();
    return;
  }
  if (id.indexOf('l-') !== 0) return;
  var l = state.log[sel] || (state.log[sel] = {});
  var v = String(el.value || '').trim();
  if (id === 'l-bed') { if (v) l.bed = v; else delete l.bed; }
  else if (id === 'l-wake') { if (v) l.wake = v; else delete l.wake; }
  else if (id === 'l-w') {
    var n = parseFloat(v.replace(',', '.'));
    if (isNaN(n) || n <= 0 || n > 400) delete l.w; else l.w = Math.round(n * 10) / 10;
  } else if (id === 'l-pu' || id === 'l-ps') {
    var k = id === 'l-pu' ? 'pu' : 'ps';
    var c = parseInt(v, 10);
    if (isNaN(c) || c < 0 || c > 9999) delete l[k]; else l[k] = c;
  }
  if (!Object.keys(l).length) delete state.log[sel];
  save();
  updateLogDerived();
});

var resetArmed = false;

    }

    ta.value = JSON.stringify(state);

    try { ok = document.execCommand('copy'); } catch (er2) {}
    setMsg(ok ? 'Скопировано.' : 'Текст выделен: скопируйте его через меню телефона.');
  } else if (a === 'copycsv') {
    var ct = document.getElementById('csv');
    ct.value = csvText();
    ct.focus(); ct.select();
    try { ct.setSelectionRange(0, ct.value.length); } catch (er4) {}
    var ok2 = false;
    try { ok2 = document.execCommand('copy'); } catch (er5) {}
    setMsg(ok2 ? 'Таблица скопирована.' : 'Таблица выделена: скопируйте её через меню телефона.');
  } else if (a === 'import') {
    var raw = document.getElementById('bk').value;
    try {
      var obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.quests) || typeof obj.days !== 'object') throw new Error('bad');
      state = migrate(obj);
      save(); renderMain(); refreshSettings();
      setMsg('Данные загружены.');
    } catch (er3) {
      setMsg('Не получилось прочитать копию. Проверьте, что вставлен весь текст.');
    }
  } else if (a === 'reset') {
    if (!resetArmed) {
      resetArmed = true;
      b.textContent = 'Нажмите ещё раз: прогресс будет удалён';
      setTimeout(function(){ resetArmed = false; if (b) b.textContent = 'Сбросить весь прогресс'; }, 4000);
    } else {
      resetArmed = false;
      state = defaults();
      sel = todayStr();
      save(); renderMain();
      overlay.classList.remove('open');
      toast('Прогресс сброшен');
    }
  }
});

// Новый день: при возврате в приложение обновляем «сегодня»
var lastToday = todayStr();
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  var t = todayStr();
  if (t !== lastToday) { if (sel === lastToday) sel = t; lastToday = t; renderMain(); }
});

/* ---------- старт ---------- */
state = load();
sel = todayStr();
renderMain();

// Офлайн: сохраняем приложение в кеш телефона (работает при открытии по https)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
