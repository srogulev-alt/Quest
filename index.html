<title>Квесты дня</title>
<style>
:root{
  --bg:#161b2e; --surface:#1f2640; --surface2:#283052; --line:#343e66;
  --text:#ece9f4; --muted:#9ba2c2;
  --gold:#e9b44c; --gold-ink:#2b1f05;
  --moss:#7cc79a; --moss-ink:#0f2a1b; --moss-bg:rgba(124,199,154,.14);
  --blood:#d9645b;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef0f7; --surface:#ffffff; --surface2:#e4e8f4; --line:#cfd5ea;
    --text:#1d2340; --muted:#5b6385;
    --gold:#b97f12; --gold-ink:#ffffff;
    --moss:#2f8a58; --moss-ink:#ffffff; --moss-bg:rgba(47,138,88,.12);
    --blood:#b8443c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:18px 16px 48px}

.notice{background:var(--surface2);border-left:4px solid var(--blood);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:14px}

/* Персонаж: единственный «громкий» элемент */
.hero{display:flex;align-items:center;gap:16px}
.lvl{flex:none;width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface)}
.lvl-n{font:700 44px/1 var(--serif);color:var(--gold)}
.lvl-w{font-size:12px;color:var(--muted);margin-top:2px}
.who h1{margin:0;font:700 26px/1.15 var(--serif)}
.who p{margin:2px 0 0;color:var(--muted)}
.bar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:var(--gold);transition:width .5s ease}
.xp{margin-top:16px;height:16px}
.hint{margin:6px 0 0;font-size:14px;color:var(--muted)}

.spheres{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sph{background:var(--surface);border-radius:12px;padding:10px 12px}
.sph-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.sph-top b{font-weight:600}
.sph-top span{color:var(--muted)}
.sph .bar{height:8px}
.sph .bar i{background:var(--moss)}

.streak{margin:16px 0 0;font-size:15px}
.streak b{font-weight:700}
.streak span{display:block;color:var(--muted);font-size:14px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px}
.day{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px;min-height:56px}
.day .wd{font-size:12px;color:var(--muted)}
.day .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid transparent;color:var(--muted);background:var(--surface)}
.day.part .num{border-color:var(--gold);color:var(--text)}
.day.win .num{background:var(--gold);color:var(--gold-ink);font-weight:700}
.day.sel{background:var(--surface2)}
.day.sel .wd{color:var(--text)}

h2{font:700 20px/1.2 var(--serif);margin:18px 0 4px}
.sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.sub.ok{color:var(--moss)}

.quest{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:64px;transition:background .2s,border-color .2s}
.quest .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.quest .chk svg{width:16px;height:16px;stroke:var(--moss-ink);stroke-width:3;fill:none;opacity:0}
.quest .qt{display:block;font-weight:600}
.quest .qs{display:block;font-size:13px;color:var(--muted)}
.quest .qx{font:700 15px var(--serif);color:var(--gold)}
.quest.done{background:var(--moss-bg);border-color:var(--moss)}
.quest.done .chk{background:var(--moss);border-color:var(--moss)}
.quest.done .chk svg{opacity:1}
.quest.done .qt{color:var(--muted)}
.empty{background:var(--surface);border-radius:14px;padding:16px;color:var(--muted)}

.boss{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.boss h3{margin:0 0 10px;font:700 18px/1.25 var(--serif)}
.boss .bar i{background:var(--blood)}
.boss p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.boss.dead{border-color:var(--gold)}
.boss.dead h3{color:var(--gold)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--gold);color:var(--gold-ink);min-height:48px}
.ghost{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.link{margin-top:22px;background:none;border:1px solid var(--line);border-radius:12px;color:var(--muted);width:100%;min-height:48px}

/* Тост и модалка */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;max-width:min(92vw,440px);font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(10,12,24,.7);display:none;align-items:center;justify-content:center;padding:24px;z-index:40}
#modal.open{display:flex}
.mcard{background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;text-align:center}
.mcard h2{margin:0 0 8px;color:var(--gold);font-size:26px}
.mcard p{margin:0 0 8px}
.mcard .btn{margin-top:14px}

/* Настройки */
#overlay{position:fixed;inset:0;background:rgba(10,12,24,.6);display:none;z-index:20}
#overlay.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h2{margin-top:6px}
.sheet h3{font:700 17px var(--serif);margin:22px 0 8px}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=number],.sheet select,.sheet textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.sheet textarea{min-height:110px;font:12px/1.4 ui-monospace,Menlo,monospace}
.qe{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.qe input{background:var(--bg)!important}
.qe-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.qe-row select{background:var(--bg)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.msg{font-size:14px;color:var(--muted);margin:8px 0 0;min-height:1.4em}
.danger{color:var(--blood);border-color:var(--blood)}

/* Дневник и подсказки */
.logbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.logbox label{display:block;font-size:14px;color:var(--muted);margin:2px 0 4px}
.logbox input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.logbox .row2{margin-top:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sleepline{margin:10px 0}
.logbox .sub{margin:10px 0 0}
.ramp{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface2);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:14px}
.ramp .ghost{flex:none}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="overlay"></div>

<script>
(function(){
'use strict';

var KEY = 'quest-life-v1';
var WIN_BONUS = 20;      // бонус XP за победный день
var WIN_SHARE = 0.6;     // доля квестов для победного дня
var MAX_Q = 6;           // максимум квестов (принцип Парето: только главное)
// «Ступени» для мягкого сокращения телефона: старт, шаг и потолок в минутах
var RAMP = {
  am: { def: 10, step: 5,  max: 60, label: 'Утро без телефона' },
  pm: { def: 30, step: 10, max: 90, label: 'Вечер без телефона' }
};
var KINDS = ['am', 'pm', 'vit', 'abs'];
var SPH = { body: 'Тело', order: 'Порядок' };
var TITLES = ['Новичок','Ученик','Странник','Следопыт','Воин','Ветеран','Мастер','Наставник','Легенда'];
var WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

var storageOk = true;
var state;
var sel;

/* ---------- даты ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function ds(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr(){ return ds(new Date()); }
function parseDate(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n){ var d = parseDate(s); d.setDate(d.getDate() + n); return ds(d); }
function fmt(s){ return parseDate(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---------- названия, сон, дневник ---------- */
function qTitle(q){
  if (q.k === 'am') return 'Не трогать телефон ' + q.m + ' мин после подъёма';
  if (q.k === 'pm') return 'Телефон убран за ' + q.m + ' мин до сна';
  return q.t;
}

function toMin(v){
  if (!/^\d{2}:\d{2}$/.test(v || '')) return null;
  var p = v.split(':');
  return Number(p[0]) * 60 + Number(p[1]);
}

function sleepMin(l){
  if (!l) return null;
  var b = toMin(l.bed), w = toMin(l.wake);
  if (b === null || w === null) return null;
  var d = w - b;
  if (d < 0) d += 1440;
  return d === 0 ? null : d;
}

function hm(m){ return Math.floor(m / 60) + ' ч ' + pad(m % 60) + ' мин'; }
function sleepText(l){ var m = sleepMin(l); return m === null ? 'не посчитан' : hm(m); }
function num(v){ return String(v).replace('.', ','); }

function logSummary(){
  var tot = 0, cnt = 0, ws = [];
  for (var i = 6; i >= 0; i--) {
    var l = state.log[addDays(sel, -i)];
    if (!l) continue;
    var m = sleepMin(l);
    if (m !== null) { tot += m; cnt++; }
    if (l.w != null) ws.push(l.w);
  }
  var parts = [];
  if (cnt) parts.push('Сон за 7 дней: в среднем ' + hm(Math.round(tot / cnt)) + ' (записей: ' + cnt + ')');
  if (ws.length > 1) {
    var dl = Math.round((ws[ws.length - 1] - ws[0]) * 10) / 10;
    parts.push('вес ' + (dl > 0 ? '+' : '') + num(dl) + ' кг за период');
  } else if (ws.length === 1) {
    parts.push('вес ' + num(ws[0]) + ' кг');
  }
  return parts.length ? parts.join('. ') + '.' : 'Сводка появится после первых записей.';
}

function logHtml(){
  var l = state.log[sel] || {};
  return '<h2>Дневник</h2>' +
    '<p class="sub">Запись за ' + esc(fmt(sel)) + '. Сон считается сам: время сна относится ко дню пробуждения.</p>' +
    '<div class="logbox">' +
      '<div class="row2">' +
        '<div><label for="l-bed">Лёг (накануне вечером)</label><input id="l-bed" type="time" value="' + esc(l.bed || '') + '"></div>' +
        '<div><label for="l-wake">Встал</label><input id="l-wake" type="time" value="' + esc(l.wake || '') + '"></div>' +
      '</div>' +
      '<p class="sleepline">Сон: <b id="sleep-val">' + sleepText(l) + '</b></p>' +
      '<div class="row3">' +
        '<div><label for="l-w">Вес, кг</label><input id="l-w" type="text" inputmode="decimal" value="' + (l.w != null ? num(l.w) : '') + '"></div>' +
        '<div><label for="l-pu">Подтягивания</label><input id="l-pu" type="text" inputmode="numeric" value="' + (l.pu != null ? l.pu : '') + '"></div>' +
        '<div><label for="l-ps">Отжимания</label><input id="l-ps" type="text" inputmode="numeric" value="' + (l.ps != null ? l.ps : '') + '"></div>' +
      '</div>' +
      '<p class="sub" id="log-sum">' + logSummary() + '</p>' +
    '</div>';
}

function updateLogDerived(){
  var a = document.getElementById('sleep-val');
  var b = document.getElementById('log-sum');
  if (a) a.textContent = sleepText(state.log[sel]);
  if (b) b.textContent = logSummary();
}

// Подсказка поднять ступень, если квест держится 5 дней из последних 7
function rampHints(){
  var t = todayStr(), html = '';
  state.quests.forEach(function(q){
    var r = RAMP[q.k];
    if (!r || q.m >= r.max) return;
    var c = 0;
    for (var i = 0; i < 7; i++) {
      var d = state.days[addDays(t, -i)];
      if (d && d.done && d.done[q.id]) c++;
    }
    if (c >= 5) {
      html += '<div class="ramp"><span>' + r.label + ': получается ' + c + ' дней из 7. Можно поднять ступень до ' +
        Math.min(r.max, q.m + r.step) + ' мин.</span>' +
        '<button class="ghost" data-a="ramp" data-id="' + esc(q.id) + '">Прибавить</button></div>';
    }
  });
  return html;
}

function csvText(){
  var dates = {};
  Object.keys(state.log).forEach(function(k){ dates[k] = 1; });
  Object.keys(state.days).forEach(function(k){
    var d = state.days[k];
    if (d && d.done && Object.keys(d.done).length) dates[k] = 1;
  });
  var vit = [], abs = [];
  state.quests.forEach(function(q){
    if (q.k === 'vit') vit.push(q.id);
    if (q.k === 'abs') abs.push(q.id);
  });
  function any(day, ids){
    return ids.some(function(id){ return day && day.done && day.done[id]; }) ? 1 : 0;
  }
  var rows = ['Дата;Лёг;Встал;Спал;Вес;Витамины;Пресс/спина;Подтягивания;Отжимания'];
  Object.keys(dates).sort().forEach(function(k){
    var l = state.log[k] || {}, day = state.days[k];
    var m = sleepMin(l);
    var p = k.split('-');
    rows.push([
      p[2] + '.' + p[1] + '.' + p[0], l.bed || '', l.wake || '',
      m === null ? '' : Math.floor(m / 60) + ':' + pad(m % 60),
      l.w != null ? num(l.w) : '', any(day, vit), any(day, abs),
      l.pu != null ? l.pu : '', l.ps != null ? l.ps : ''
    ].join(';'));
  });
  return rows.join('\n');
}

function defaults(){
  return {
    v: 1,
    name: 'Сергей',
    quests: [
      { id: 'q1', t: '', k: 'am', m: RAMP.am.def, s: 'order', x: 15 },
      { id: 'q2', t: '', k: 'pm', m: RAMP.pm.def, s: 'order', x: 15 },
      { id: 'q3', t: 'Витамины', k: 'vit', s: 'body', x: 5 },
      { id: 'q4', t: 'Пресс и спина', k: 'abs', s: 'body', x: 15 },
      { id: 'q5', t: 'Подтягивания и отжимания', s: 'body', x: 15 },
      { id: 'q6', t: 'Отбой по плану', s: 'order', x: 10 }
    ],
    days: {},
    log: {},
    boss: { name: '30 дней режима', hp: 30, start: todayStr(), reward: '' }
  };
}

function migrate(o){
  var d = defaults();
  if (!o || typeof o !== 'object') return d;
  var quests = d.quests;
  if (Array.isArray(o.quests)) {
    quests = o.quests.slice(0, MAX_Q).map(function(q, i){
      var x = Number(q && q.x);
      var k = (q && KINDS.indexOf(q.k) >= 0) ? q.k : undefined;
      var item = {
        id: String((q && q.id) || ('q' + Date.now() + i)),
        t: String((q && q.t) || (k ? '' : 'Квест')),
        s: (q && q.s === 'body') ? 'body' : 'order',
        x: [5, 10, 15, 20].indexOf(x) >= 0 ? x : 10
      };
      if (k) item.k = k;
      if (RAMP[k]) item.m = Math.max(1, Math.min(RAMP[k].max, parseInt(q.m, 10) || RAMP[k].def));
      return item;
    });
  }
  var boss = d.boss;
  if (o.boss && typeof o.boss === 'object') {
    boss = {
      name: String(o.boss.name || d.boss.name),
      hp: Math.max(1, parseInt(o.boss.hp, 10) || d.boss.hp),
      start: /^\d{4}-\d{2}-\d{2}$/.test(o.boss.start || '') ? o.boss.start : d.boss.start,
      reward: String(o.boss.reward || '')
    };
  }
  return {
    v: 1,
    name: typeof o.name === 'string' ? o.name : d.name,
    quests: quests,
    days: (o.days && typeof o.days === 'object') ? o.days : {},
    log: (o.log && typeof o.log === 'object') ? o.log : {},
    boss: boss
  };
}

function load(){
  try {
    localStorage.setItem(KEY + '-test', '1');
    localStorage.removeItem(KEY + '-test');
  } catch (e) { storageOk = false; return defaults(); }
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* повреждённые данные: начинаем заново */ }
  return defaults();
}

function save(){
  if (!storageOk) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { storageOk = false; renderMain(); }
}

/* ---------- расчёты ---------- */
function isWin(day){
  if (!day || !day.done) return false;
  var c = Object.keys(day.done).length;
  var n = Math.max(day.n || 0, c);
  return c > 0 && c >= Math.ceil(n * WIN_SHARE);
}

function levelInfo(xp, base, step){
  var l = 1, need = base, rest = xp;
  while (rest >= need) { rest -= need; l++; need = base + step * (l - 1); }
  return { level: l, into: rest, need: need };
}

function xpOf(){
  var tot = 0, sph = { body: 0, order: 0 };
  Object.keys(state.days).forEach(function(k){
    var day = state.days[k];
    if (!day || !day.done) return;
    Object.keys(day.done).forEach(function(id){
      var e = day.done[id];
      if (!e) return;
      tot += e.x;
      sph[e.s] = (sph[e.s] || 0) + e.x;
    });
    if (isWin(day)) tot += WIN_BONUS;
  });
  return { tot: tot, sph: sph };
}

function levels(){
  var x = xpOf();
  return {
    t: levelInfo(x.tot, 100, 50).level,
    body: levelInfo(x.sph.body || 0, 80, 40).level,
    order: levelInfo(x.sph.order || 0, 80, 40).level
  };
}

function firstDate(){
  var f = null;
  Object.keys(state.days).forEach(function(k){
    var d = state.days[k];
    if (d && d.done && Object.keys(d.done).length && (f === null || k < f)) f = k;
  });
  return f;
}

// Серия побед подряд. Один пропуск прощается (щит), не чаще раза в 7 дней.
function streakInfo(){
  var first = firstDate(), t = todayStr();
  if (!first) return { n: 0, shield: true };
  var todayWin = isWin(state.days[t]);
  var cur = todayWin ? t : addDays(t, -1);
  var age = todayWin ? 0 : 1;
  var n = 0, since = 99, forgiveAge = null;
  while (cur >= first) {
    if (isWin(state.days[cur])) { n++; since++; }
    else if (since >= 6) { since = 0; if (forgiveAge === null) forgiveAge = age; }
    else break;
    cur = addDays(cur, -1);
    age++;
  }
  return { n: n, shield: forgiveAge === null || forgiveAge >= 7 };
}

function bossInfo(){
  var b = state.boss, w = 0;
  Object.keys(state.days).forEach(function(k){
    if (k >= b.start && isWin(state.days[k])) w++;
  });
  var hp = Math.max(1, parseInt(b.hp, 10) || 1);
  return { wins: w, hp: hp, left: Math.max(0, hp - w) };
}

function plural(n, a, b, c){
  var m = n % 100, k = n % 10;
  if (m >= 11 && m <= 14) return c;
  if (k === 1) return a;
  if (k >= 2 && k <= 4) return b;
  return c;
}

/* ---------- действия ---------- */
function toggle(date, id){
  var q = null;
  state.quests.forEach(function(item){ if (item.id === id) q = item; });
  if (!q) return;
  var before = levels();
  var bossBefore = bossInfo().left;
  var day = state.days[date] || (state.days[date] = { done: {}, n: 0 });
  if (!day.done) day.done = {};
  day.n = state.quests.length;
  var wasWin = isWin(day);
  var added;
  if (day.done[id]) { delete day.done[id]; added = false; }
  else { day.done[id] = { x: q.x, s: q.s }; added = true; }
  save();
  renderMain();

  var after = levels();
  var bossAfter = bossInfo().left;
  if (added) {
    var m = '+' + q.x + ' XP, ' + SPH[q.s];
    if (isWin(day) && !wasWin) m += '. Победный день: +' + WIN_BONUS + ' XP';
    toast(m);
  } else {
    toast('Отметка снята');
  }

  var lines = [];
  var title = '';
  if (bossBefore > 0 && bossAfter === 0) {
    title = 'Босс повержен';
    lines.push(state.boss.reward ? 'Награда: ' + state.boss.reward : 'Назначьте себе награду и нового босса в настройках.');
  }
  if (after.t > before.t) {
    if (!title) title = 'Уровень ' + after.t;
    lines.push('Новый уровень: ' + after.t + '. Титул: ' + titleFor(after.t));
  }
  ['body', 'order'].forEach(function(k){
    if (after[k] > before[k]) lines.push(SPH[k] + ': уровень ' + after[k]);
  });
  if (title) modal(title, lines);
  else if (lines.length) toast(lines.join('. '));
}

    var rq = null;
    state.quests.forEach(function(item){ if (item.id === b.getAttribute('data-id')) rq = item; });
    if (rq && RAMP[rq.k]) {
      rq.m = Math.min(RAMP[rq.k].max, rq.m + RAMP[rq.k].step);
      save(); renderMain();
      toast('Новая ступень: ' + qTitle(rq));
    }
  }
});

// Дневник: сохраняем по завершении ввода, без перерисовки (чтобы не закрывался выбор времени)
app.addEventListener('change', function(e){
  var el = e.target, id = el.id || '';
  if (id.indexOf('l-') !== 0) return;
  var l = state.log[sel] || (state.log[sel] = {});
  var v = String(el.value || '').trim();
  if (id === 'l-bed') { if (v) l.bed = v; else delete l.bed; }
  else if (id === 'l-wake') { if (v) l.wake = v; else delete l.wake; }
  else if (id === 'l-w') {
    var n = parseFloat(v.replace(',', '.'));
    if (isNaN(n) || n <= 0 || n > 400) delete l.w; else l.w = Math.round(n * 10) / 10;
  } else if (id === 'l-pu' || id === 'l-ps') {
    var k = id === 'l-pu' ? 'pu' : 'ps';
    var c = parseInt(v, 10);
    if (isNaN(c) || c < 0 || c > 9999) delete l[k]; else l[k] = c;
  }
  if (!Object.keys(l).length) delete state.log[sel];
  save();
  updateLogDerived();
});

overlay.addEventListener('input', function(e){

  if (el.id === 'f-name') state.name = el.value;
  else if (el.id === 'f-bn') state.boss.name = el.value;
  else if (el.id === 'f-br') state.boss.reward = el.value;
  else if (el.id === 'f-bh') state.boss.hp = Math.max(1, parseInt(el.value, 10) || 1);
  else if (row && el.classList.contains('f-qt')) state.quests[Number(row.getAttribute('data-i'))].t = el.value;
  else if (row && el.classList.contains('f-qm')) {
    var rq = state.quests[Number(row.getAttribute('data-i'))];
    var mm = parseInt(el.value, 10);
    if (!mm) return;
    rq.m = Math.max(1, Math.min(RAMP[rq.k].max, mm));
  }
  else return;
  save();
  renderMain();
});

overlay.addEventListener('change', function(e){
  var el = e.target;
  var row = el.closest('.qe');
  if (!row) return;
  var q = state.quests[Number(row.getAttribute('data-i'))];
  if (el.classList.contains('f-qs')) q.s = el.value === 'body' ? 'body' : 'order';
  else if (el.classList.contains('f-qx')) q.x = Number(el.value);
  save();
  renderMain();
});

var resetArmed = false;
overlay.addEventListener('click', function(e){
  if (e.target === overlay) { overlay.classList.remove('open'); return; }
  var b = e.target.closest('[data-a]');
  if (!b) return;
  var a = b.getAttribute('data-a');
  if (a === 'close') {
    overlay.classList.remove('open');
  } else if (a === 'qadd') {
    if (state.quests.length < MAX_Q) {
      state.quests.push({ id: 'q' + Date.now(), t: 'Новый квест', s: 'body', x: 10 });
      save(); renderMain(); refreshSettings();
    }
  } else if (a === 'qdel') {
    state.quests.splice(Number(b.getAttribute('data-i')), 1);
    save(); renderMain(); refreshSettings();
  } else if (a === 'bnew') {
    state.boss.start = todayStr();
    save(); renderMain(); refreshSettings();
  } else if (a === 'copy') {
    var ta = document.getElementById('bk');
    ta.value = JSON.stringify(state);
    ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (er) {}
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (er2) {}
    setMsg(ok ? 'Скопировано.' : 'Текст выделен: скопируйте его через меню телефона.');
  } else if (a === 'copycsv') {
    var ct = document.getElementById('csv');
    ct.value = csvText();
    ct.focus(); ct.select();
    try { ct.setSelectionRange(0, ct.value.length); } catch (er4) {}
    var ok2 = false;
    try { ok2 = document.execCommand('copy'); } catch (er5) {}
    setMsg(ok2 ? 'Таблица скопирована.' : 'Таблица выделена: скопируйте её через меню телефона.');
  } else if (a === 'import') {
    var raw = document.getElementById('bk').value;
    try {
      var obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.quests) || typeof obj.days !== 'object') throw new Error('bad');
      state = migrate(obj);
      save(); renderMain(); refreshSettings();
      setMsg('Данные загружены.');
    } catch (er3) {
      setMsg('Не получилось прочитать копию. Проверьте, что вставлен весь текст.');
    }
  } else if (a === 'reset') {
    if (!resetArmed) {
      resetArmed = true;
      b.textContent = 'Нажмите ещё раз: прогресс будет удалён';
      setTimeout(function(){ resetArmed = false; if (b) b.textContent = 'Сбросить весь прогресс'; }, 4000);
    } else {
      resetArmed = false;
      state = defaults();
      sel = todayStr();
      save(); renderMain();
      overlay.classList.remove('open');
      toast('Прогресс сброшен');
    }
  }
});

// Новый день: при возврате в приложение обновляем «сегодня»
var lastToday = todayStr();
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  var t = todayStr();
  if (t !== lastToday) { if (sel === lastToday) sel = t; lastToday = t; renderMain(); }
});

/* ---------- старт ---------- */
state = load();
sel = todayStr();
renderMain();

// Офлайн: сохраняем приложение в кеш телефона (работает при открытии по https)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
