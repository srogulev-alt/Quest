<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Администратор: тест по постановлениям Пленумов</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<div class="wrap wide">
  <header><h1 id="h1">Администратор теста</h1><div class="small" id="who"></div></header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="app"><p class="note">Загрузка…</p></main>
</div>
<script>
const $ = id => document.getElementById(id);
const LET = ["А","Б","В","Г"];
const COLS = {civ:"Гражданская", adm:"Административная", bank:"Банкротная"};
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtT = ts => ts ? new Date(ts*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const mmss = s => s==null ? "—" : Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

async function api(path, method, body){
  const opt = {method: method||"GET", headers:{"X-Test-Client":"1"}, cache:"no-store"};
  if (body !== undefined){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  let r, j = null;
  try { r = await fetch(path, opt); } catch(e){ throw new Error("Нет связи с сервером"); }
  try { j = await r.json(); } catch(e){}
  if (r.status === 401 && path !== "/api/admin/login"){ gate(); throw new Error("Требуется вход"); }
  if (!r.ok) throw new Error((j && j.error) || ("Ошибка " + r.status));
  return j;
}
const msg = (t, ok) => { const el = $("msg"); if (el){ el.className = ok ? "note" : "err"; el.textContent = t; } else if (!ok) alert(t); };
// ошибки обработчиков (сеть, сервер) не должны пропадать молча
window.addEventListener("unhandledrejection", e => {
  const m = e.reason && e.reason.message;
  if (m && m !== "Требуется вход"){ e.preventDefault(); msg(m); }
});

/* ---------- вход ---------- */
async function gate(){
  $("tabs").hidden = true; $("who").textContent = "";
  let me;
  try { me = await api("/api/admin/me"); }
  catch(e){ $("app").innerHTML = `<p class="err">${esc(e.message)}. Обновите страницу.</p>`; return; }
  if (!me.configured) return setupScreen();
  if (!me.authed) return loginScreen();
  ROLE = me.role; NEWC = me.complaints_new || 0;
  $("h1").textContent = ROLE === "admin" ? "Администратор теста" : "Отдел анализа: вопросы и замечания";
  document.title = $("h1").textContent;
  $("tabs").hidden = false;
  $("who").innerHTML = `${esc(me.role_title)}${me.who ? " · " + esc(me.who) : ""} <button id="out">Выйти</button>`;
  $("out").onclick = async () => { await api("/api/admin/logout","POST",{}); gate(); };
  show("q");
}
function setupScreen(){
  $("app").innerHTML = `<div class="start"><h2>Первый запуск: задайте пароль администратора</h2>
    <p class="note">Пароль защищает редактор вопросов, настройки и результаты. Не короче 6 символов. Восстановить его нельзя, но администратор сервера может задать новый командой <code>python reset_admin.py НОВЫЙ_ПАРОЛЬ</code> (см. README).</p>
    <div class="box"><label class="f" for="p1">Пароль</label><input type="password" id="p1" autocomplete="new-password">
      <label class="f" for="p2">Повторите пароль</label><input type="password" id="p2" autocomplete="new-password">
      <div class="err" id="msg" role="alert"></div><div class="row"><button class="primary" id="ok">Сохранить пароль</button></div></div></div>`;
  $("ok").onclick = async () => {
    if ($("p1").value !== $("p2").value) return msg("Пароли не совпадают.");
    try { await api("/api/admin/setup","POST",{password:$("p1").value}); gate(); } catch(e){ msg(e.message); }
  };
}
function loginScreen(){
  $("app").innerHTML = `<div class="start"><h2>Вход для администратора и Отдела анализа</h2>
    <p class="note">Введите свой пароль: администратора или Отдела анализа. Права определяются паролем.</p><div class="box">
    <label class="f" for="lp">Пароль</label><input type="password" id="lp" autocomplete="current-password">
    <label class="f" for="lw">Ваше имя <span class="small">(необязательно, для журнала изменений)</span></label><input type="text" id="lw" maxlength="80" autocomplete="name">
    <div class="err" id="msg" role="alert"></div><div class="row"><button class="primary" id="ok">Войти</button></div></div></div>`;
  const go = async () => { try { await api("/api/admin/login","POST",{password:$("lp").value, who:$("lw").value}); gate(); } catch(e){ msg(e.message); $("lp").value=""; $("lp").focus(); } };
  $("lw").value = (() => { try { return localStorage.getItem("plenum-staff-name") || ""; } catch(e){ return ""; } })();
  $("lw").onchange = () => { try { localStorage.setItem("plenum-staff-name", $("lw").value.trim()); } catch(e){} };
  $("lw").onkeydown = e => { if (e.key === "Enter") go(); };
  $("ok").onclick = go; $("lp").onkeydown = e => { if (e.key === "Enter") go(); }; $("lp").focus();
}

/* ---------- вкладки ---------- */
// вкладки по ролям: Отделу анализа доступны только вопросы (правка) и замечания участников
const TABS = {
  admin:   [["q","Вопросы"],["b","Коллегии и блоки"],["s","Настройки"],["r","Результаты"],["c","Замечания"],["l","Журнал изменений"]],
  analyst: [["q","Вопросы"],["c","Замечания"],["l","Журнал изменений"],["p","Пароль"]],
};
let NEWC = 0;   // новых замечаний участников (число на вкладке)
let ROLE = null;
const isAdmin = () => ROLE === "admin";
function show(t){
  $("tabs").innerHTML = TABS[ROLE].map(([k,n]) => `<button data-t="${k}" class="${k===t?"on":""}">${n}${k==="c"&&NEWC?` <span class="badge" id="newc">${NEWC}</span>`:""}</button>`).join("") +
    `<a class="right" href="/" target="_blank" rel="noopener"><button>Открыть тест ↗</button></a>`;
  document.querySelectorAll("#tabs [data-t]").forEach(b => b.onclick = () => show(b.dataset.t));
  ({q:qList,b:blocksScreen,s:settingsScreen,r:resultsScreen,c:complaintsScreen,l:logScreen,p:pwScreen})[t]()
    .catch(e => { if (e.message !== "Требуется вход") $("app").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
}

/* ---------- вопросы ---------- */
let QF = {block:0, q:"", offset:0}, BLOCKS = [];
async function loadBlocks(){ BLOCKS = (await api("/api/admin/blocks")).blocks; }
async function qList(){
  await loadBlocks();
  const p = new URLSearchParams({limit:100, offset:QF.offset}); if (QF.block) p.set("block", QF.block); if (QF.q) p.set("q", QF.q);
  const r = await api("/api/admin/questions?" + p);
  $("app").innerHTML = `<h2>Вопросы</h2>
    ${isAdmin() ? `<div class="ed-top"><button class="primary" id="add">Добавить вопрос</button>
      <a href="/api/admin/export"><button>Экспорт JSON</button></a>
      <button id="imp">Импорт (объединить)</button><button id="impAll">Импорт (заменить всё)</button>
      <input type="file" id="file" accept=".json,application/json" hidden></div>`
      : `<p class="note">Можно править формулировки, варианты, правильный ответ, ссылку на постановление и пояснение. Добавлять и удалять вопросы может администратор. Все правки попадают в журнал изменений.</p>`}
    <div class="ed-top"><input type="search" id="srch" placeholder="Поиск по тексту, акту, номеру" value="${esc(QF.q)}">
      <select id="blk"><option value="0">Все блоки</option>${BLOCKS.map(b=>`<option value="${b.id}">${b.id}. ${esc(b.title)} (${b.n})</option>`).join("")}</select></div>
    <p class="note">Найдено: ${r.total}${r.total>QF.offset+100?`. Показано ${QF.offset+1}–${QF.offset+100}`:""}</p>
    <div class="ed-list">${r.items.map(q=>`<div class="ed-row"><span class="id">${esc(q.id)}</span><div><div class="t">${esc(q.q)}</div>
      <div class="src">${esc(q.act)}${q.p?", "+esc(q.p):""} · верный: ${LET[q.a]}</div></div><button data-e="${esc(q.id)}">Изменить</button></div>`).join("")}</div>
    <div class="row">${QF.offset>0?`<button id="pv">← Назад</button>`:""}${r.total>QF.offset+100?`<button id="nx">Дальше →</button>`:""}</div><div id="msg"></div>`;
  $("blk").value = String(QF.block);
  let t; $("srch").oninput = e => { clearTimeout(t); t = setTimeout(() => { QF.q = e.target.value; QF.offset = 0; qList().then(()=>{ const s=$("srch"); s.focus(); s.setSelectionRange(s.value.length,s.value.length); }); }, 300); };
  $("blk").onchange = e => { QF.block = +e.target.value; QF.offset = 0; qList(); };
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => qForm(b.dataset.e));
  if ($("pv")) $("pv").onclick = () => { QF.offset -= 100; qList(); };
  if ($("nx")) $("nx").onclick = () => { QF.offset += 100; qList(); };
  if (!isAdmin()) return;
  $("add").onclick = () => qForm(null);
  let mode = "merge";
  $("imp").onclick = () => { mode = "merge"; $("file").click(); };
  $("impAll").onclick = () => { if (confirm("Все текущие вопросы будут заменены содержимым файла. Результаты не изменятся. Продолжить?")){ mode = "replace"; $("file").click(); } };
  $("file").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { const d = JSON.parse(await f.text()); const r = await api("/api/admin/import?mode="+mode,"POST",d);
      await qList(); msg(`Импорт: добавлено ${r.added}, обновлено ${r.updated}.`, true); } catch(err){ msg("Не удалось импортировать: " + err.message); }
  };
}
async function qForm(id, back){
  back = back || qList;
  await loadBlocks();
  if (!BLOCKS.length){ alert("Сначала создайте блок на вкладке «Коллегии и блоки»."); return; }
  const q = id ? await api("/api/admin/questions/" + encodeURIComponent(id)) : {id:"", b:QF.block||BLOCKS[0].id, q:"", o:["","","",""], a:0, act:"", p:"", e:""};
  $("app").innerHTML = `<h2>${id?"Вопрос "+esc(q.id):"Новый вопрос"}</h2><div class="form">
    <label class="f" for="fb">Блок</label><select id="fb">${BLOCKS.map(b=>`<option value="${b.id}">${b.id}. ${esc(b.title)}</option>`).join("")}</select>
    <label class="f" for="fq">Текст вопроса</label><textarea id="fq" rows="3">${esc(q.q)}</textarea>
    <label class="f">Варианты ответа (отметьте правильный)</label>
    ${q.o.map((t,i)=>`<div class="optrow${q.a===i?" correct":""}" id="or${i}"><input type="radio" name="corr" value="${i}" ${q.a===i?"checked":""} aria-label="Вариант ${LET[i]} правильный"><input type="text" id="fo${i}" value="${esc(t)}" placeholder="Вариант ${LET[i]}"></div>`).join("")}
    <label class="f" for="fact">Постановление</label><input type="text" id="fact" value="${esc(q.act)}">
    <label class="f" for="fp">Пункт</label><input type="text" id="fp" value="${esc(q.p)}">
    <label class="f" for="fe">Пояснение к ответу</label><textarea id="fe" rows="4">${esc(q.e)}</textarea>
    <div class="err" id="msg" role="alert"></div>
    <div class="row"><button class="primary" id="save">Сохранить вопрос</button><button id="cancel">Отмена</button>${id&&isAdmin()?`<button class="danger" id="del">Удалить</button>`:""}</div></div>
    ${id ? `<h3>История изменений</h3><div id="hist"><p class="note">Загрузка…</p></div>` : ""}`;
  if (id) api("/api/admin/questions/" + encodeURIComponent(id) + "/history")
    .then(h => { $("hist").innerHTML = h.items.length ? h.items.map(x => logEntry(x, false)).join("") : `<p class="note">Изменений через панель пока не было.</p>`; })
    .catch(e => { $("hist").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
  $("fb").value = String(q.b);
  document.querySelectorAll("input[name=corr]").forEach(r => r.onchange = () => { for (let i=0;i<4;i++) $("or"+i).classList.toggle("correct", +r.value===i && r.checked); });
  $("cancel").onclick = () => back();
  if ($("del")) $("del").onclick = async () => { if (confirm("Удалить вопрос " + q.id + "?")){ await api("/api/admin/questions/"+encodeURIComponent(id),"DELETE"); back(); } };
  $("save").onclick = async () => {
    const body = {b:+$("fb").value, q:$("fq").value, o:[0,1,2,3].map(i=>$("fo"+i).value), a:+document.querySelector("input[name=corr]:checked").value, act:$("fact").value, p:$("fp").value, e:$("fe").value};
    try {
      if (id){ const r = await api("/api/admin/questions/"+encodeURIComponent(id),"PUT",body); if (r && r.changed === false){ msg("Изменений нет: сохранять нечего.", true); return; } }
      else await api("/api/admin/questions","POST",body);
      back(); }
    catch(e){ msg(e.message); }
  };
}

/* ---------- блоки и коллегии ---------- */
async function blocksScreen(){
  const r = await api("/api/admin/blocks"); BLOCKS = r.blocks;
  $("app").innerHTML = `<h2>Коллегии и блоки</h2>
    <p class="note">Отметьте, каким коллегиям подходит каждый блок. Вариант «Все темы» включает все блоки. Изменения сохраняются сразу.</p>
    <table><thead><tr><th>№</th><th>Блок</th><th>Вопросов</th>${Object.values(COLS).map(c=>`<th>${c}</th>`).join("")}<th></th></tr></thead><tbody>
    ${BLOCKS.map(b=>`<tr><td>${b.id}</td><td><input type="text" data-t="${b.id}" value="${esc(b.title)}" style="width:100%"></td><td>${b.n}</td>
      ${Object.keys(COLS).map(c=>`<td><input type="checkbox" data-b="${b.id}" data-c="${c}" aria-label="${COLS[c]}, блок ${b.id}" ${b.cols.includes(c)?"checked":""}></td>`).join("")}
      <td>${b.n?"":`<button data-d="${b.id}" class="danger">Удалить</button>`}</td></tr>`).join("")}</tbody></table>
    <p class="note" id="sum"></p><div class="ed-top"><input type="text" id="nt" placeholder="Название нового блока" style="flex:1"><button id="addb">Добавить блок</button></div><div id="msg"></div>`;
  const sum = () => { $("sum").textContent = `Вопросов по направлениям: все темы ${r.totals.mix} · ` + Object.keys(COLS).map(c => COLS[c] + " " + BLOCKS.filter(b=>b.cols.includes(c)).reduce((s,b)=>s+b.n,0)).join(" · "); };
  sum();
  document.querySelectorAll("[data-b]").forEach(el => el.onchange = async () => {
    const b = BLOCKS.find(x => x.id === +el.dataset.b);
    b.cols = [...document.querySelectorAll(`[data-b="${b.id}"]:checked`)].map(x => x.dataset.c);
    await api("/api/admin/blocks/"+b.id,"PUT",{cols:b.cols}); sum();
  });
  document.querySelectorAll("input[data-t]").forEach(el => el.onchange = async () => { await api("/api/admin/blocks/"+el.dataset.t,"PUT",{title:el.value}); });
  document.querySelectorAll("[data-d]").forEach(el => el.onclick = async () => { if (confirm("Удалить пустой блок?")){ await api("/api/admin/blocks/"+el.dataset.d,"DELETE"); blocksScreen(); } });
  $("addb").onclick = async () => { if (!$("nt").value.trim()) return msg("Введите название блока."); await api("/api/admin/blocks","POST",{title:$("nt").value, cols:["civ","adm","bank"]}); blocksScreen(); };
  $("nt").onkeydown = e => { if (e.key === "Enter") $("addb").click(); };
}

/* ---------- настройки ---------- */
async function settingsScreen(){
  const r = await api("/api/admin/settings"), s = r.settings; await loadBlocks();
  $("app").innerHTML = `<h2>Настройки теста</h2><div class="box" style="max-width:680px">
    <div class="chk"><input type="checkbox" id="s-open" ${s.open?"checked":""}><label for="s-open">Тест открыт для прохождения</label></div>
    <label class="f" for="s-t">Название теста</label><input type="text" id="s-t" value="${esc(s.title)}">
    <label class="f" for="s-c">Вопросов в одной попытке</label><input type="number" id="s-c" min="1" max="200" value="${s.count}">
    <label class="f" for="s-m">Время на попытку, минут</label><input type="number" id="s-m" min="1" max="300" value="${s.minutes}">
    <label class="f" for="s-a">Попыток на одну фамилию (0 — без ограничения)</label><input type="number" id="s-a" min="0" max="100" value="${s.max_attempts}">
    <label class="f" for="s-v">Что показывать после теста</label>
    <select id="s-v"><option value="full">Разбор: верные ответы и пояснения</option><option value="score">Только баллы и номера ошибочных вопросов</option></select>
    <label class="f">Варианты выбора при входе</label>
    ${Object.entries({mix:"Все темы", civ:"Гражданская коллегия", adm:"Административная коллегия", bank:"Банкротная коллегия"}).map(([k,v])=>`<div class="chk"><input type="checkbox" class="s-cl" id="cl-${k}" value="${k}" ${s.cols.includes(k)?"checked":""}><label for="cl-${k}">${v}</label></div>`).join("")}
    <label class="f">Блоки вопросов (ничего не отмечено — все)</label>
    ${BLOCKS.map(b=>`<div class="chk"><input type="checkbox" class="s-b" id="sb-${b.id}" value="${b.id}" ${s.blocks.includes(b.id)?"checked":""}><label for="sb-${b.id}">${b.id}. ${esc(b.title)} (${b.n})</label></div>`).join("")}
    <div id="msg" role="alert"></div><div class="row"><button class="primary" id="save">Сохранить настройки</button></div></div>
    <h3>Доступ Отдела анализа</h3><div class="box" style="max-width:520px" id="an"><p class="note">Загрузка…</p></div>
    <h3>Смена пароля администратора</h3>${pwBoxHtml()}`;
  pwBoxInit(); analystBox();
  $("s-v").value = s.review;
  $("save").onclick = async () => {
    const body = {open:$("s-open").checked, title:$("s-t").value, count:$("s-c").value, minutes:$("s-m").value, max_attempts:$("s-a").value, review:$("s-v").value,
      cols:[...document.querySelectorAll(".s-cl:checked")].map(x=>x.value), blocks:[...document.querySelectorAll(".s-b:checked")].map(x=>+x.value)};
    try { await api("/api/admin/settings","PUT",body); msg("Настройки сохранены. Они действуют для новых попыток.", true); } catch(e){ msg(e.message); }
  };
}
async function analystBox(){
  const r = await api("/api/admin/analyst");
  $("an").innerHTML = `<p>${r.enabled ? "Доступ <b>открыт</b>." : "Доступ <b>закрыт</b>: пароль не задан."}</p>
    <p class="note">Отдел анализа входит на эту же страницу своим паролем и может только править вопросы и работать с замечаниями участников. Настройки, результаты участников, блоки, импорт и удаление ему недоступны. При смене пароля все входы отдела закрываются.</p>
    <label class="f" for="anp">${r.enabled ? "Новый пароль Отдела анализа" : "Пароль Отдела анализа"} (не короче 6 символов)</label><input type="password" id="anp" autocomplete="new-password">
    <div id="anmsg" role="alert"></div>
    <div class="row"><button class="primary" id="anset">${r.enabled ? "Сменить пароль" : "Открыть доступ"}</button>${r.enabled ? `<button class="danger" id="anoff">Закрыть доступ</button>` : ""}</div>`;
  const m = (t, ok) => { $("anmsg").className = ok ? "note" : "err"; $("anmsg").textContent = t; };
  $("anset").onclick = async () => { try { await api("/api/admin/analyst","PUT",{password:$("anp").value}); await analystBox(); m("Пароль Отдела анализа сохранён. Передайте его сотрудникам отдела.", true); } catch(e){ m(e.message); } };
  if ($("anoff")) $("anoff").onclick = async () => { if (confirm("Закрыть доступ Отдела анализа? Все входы отдела перестанут действовать.")){ await api("/api/admin/analyst","DELETE"); await analystBox(); m("Доступ закрыт.", true); } };
}
function pwBoxHtml(){
  return `<div class="box" style="max-width:420px"><label class="f" for="o">Текущий пароль</label><input type="password" id="o" autocomplete="current-password">
    <label class="f" for="n">Новый пароль (не короче 6 символов)</label><input type="password" id="n" autocomplete="new-password"><div id="msg2" role="alert"></div>
    <div class="row"><button id="chg">Сменить пароль</button></div></div>`;
}
function pwBoxInit(){
  $("chg").onclick = async () => { const m = $("msg2");
    try { await api("/api/admin/password","POST",{old:$("o").value,new:$("n").value}); m.className="note"; m.textContent="Пароль изменён. Другие открытые входы с прежним паролем закрыты."; $("o").value=$("n").value=""; }
    catch(e){ m.className="err"; m.textContent=e.message; } };
}
async function pwScreen(){
  $("app").innerHTML = `<h2>Смена пароля Отдела анализа</h2><p class="note">Пароль общий для отдела: после смены сообщите его коллегам, их открытые входы закроются. Если пароль забыт, его может задать администратор.</p>${pwBoxHtml()}`;
  pwBoxInit();
}

/* ---------- журнал изменений вопросов ---------- */
const FIELDS = [["b","Блок"],["q","Текст вопроса"],["o","Варианты"],["a","Правильный ответ"],["act","Постановление"],["p","Пункт"],["e","Пояснение"]];
const ACTIONS = {update:"изменён", create:"добавлен", delete:"удалён"};
function fieldText(k, v){
  if (v == null) return "";
  if (k === "o") return v.map((x,i) => LET[i] + ") " + x).join("\n");
  if (k === "a") return LET[v];
  return String(v);
}
function logEntry(x, withOpen = true){
  const by = esc(x.role_title) + (x.who ? " · " + esc(x.who) : "");
  let body = "";
  if (x.action === "update"){
    const ch = FIELDS.filter(([k]) => JSON.stringify(x.before[k]) !== JSON.stringify(x.after[k]));
    body = ch.map(([k,n]) => `<div class="diff"><b>${n}</b><div class="was">${esc(fieldText(k, x.before[k]))}</div><div class="now">${esc(fieldText(k, x.after[k]))}</div></div>`).join("");
  } else {
    const q = x.after || x.before;
    body = `<div class="diff"><div class="${x.after?"now":"was"}">${esc(q.q)}</div></div>`;
  }
  return `<details class="logitem"><summary>${fmtT(x.at)} · вопрос <b>${esc(x.qid)}</b> ${ACTIONS[x.action] || x.action} · ${by}</summary>${body}
    ${withOpen && x.action !== "delete" ? `<div class="row" style="margin:8px 0 0"><button data-lq="${esc(x.qid)}">Открыть вопрос</button></div>` : ""}</details>`;
}
let LF = "";
async function logScreen(){
  const r = await api("/api/admin/question_log" + (LF ? "?role=" + LF : ""));
  $("app").innerHTML = `<h2>Журнал изменений вопросов</h2>
    <p class="note">Правки, сделанные через панель (последние 300). Нажмите на запись, чтобы увидеть, что было и что стало. Импорт банка из файла в журнал не записывается.</p>
    <div class="ed-top"><select id="lf"><option value="">Все</option><option value="analyst">Отдел анализа</option><option value="admin">Администратор</option></select></div>
    ${r.items.length ? r.items.map(x => logEntry(x)).join("") : `<p class="note">Записей нет.</p>`}`;
  $("lf").value = LF; $("lf").onchange = e => { LF = e.target.value; logScreen(); };
  bindLogButtons(logScreen);
}
function bindLogButtons(back){ document.querySelectorAll("[data-lq]").forEach(b => b.onclick = () => qForm(b.dataset.lq, back)); }

/* ---------- результаты ---------- */
let RF = {name:"", col:""};
async function resultsScreen(){
  const p = new URLSearchParams(); if (RF.name) p.set("name", RF.name); if (RF.col) p.set("col", RF.col);
  const [r, st] = await Promise.all([api("/api/admin/attempts?"+p), api("/api/admin/stats")]);
  $("app").innerHTML = `<h2>Результаты</h2>
    <p class="note">Попыток завершено: ${st.attempts}${st.avg!=null?`, средний результат ${st.avg}%`:""}. Результаты поступают на сервер сами, пересылать файлы не нужно.</p>
    <div class="ed-top"><input type="search" id="fn" placeholder="Фильтр по фамилии" value="${esc(RF.name)}">
      <select id="fc"><option value="">Все направления</option><option value="mix">Все темы</option>${Object.entries(COLS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
      <a href="/api/admin/results.csv"><button>Экспорт в CSV</button></a></div>
    ${r.items.length?`<table><thead><tr><th>Участник</th><th>Направление</th><th>Начало</th><th>Результат</th><th>%</th><th>Время</th><th></th></tr></thead><tbody>
    ${r.items.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.col_title)}</td><td>${fmtT(a.started)}</td>
      <td>${a.finished?`${a.score} из ${a.total}${a.timeout?" (время вышло)":""}`:`<span class="badge">не завершён</span>`}</td>
      <td>${a.finished?Math.round(a.score*100/a.total)+"%":""}</td><td>${a.finished?mmss(a.seconds):""}</td>
      <td><button data-v="${a.id}">Подробнее</button> <button class="danger" data-x="${a.id}">Удалить</button></td></tr>`).join("")}</tbody></table>`:`<p class="note">Попыток пока нет.</p>`}
    ${st.hard.length?`<h3>Вопросы, в которых чаще всего ошибаются</h3><table><thead><tr><th>Вопрос</th><th>Ошибок</th></tr></thead><tbody>
    ${st.hard.map(h=>`<tr><td>${esc(h.qid)}: ${esc(h.q)}</td><td>${h.bad} из ${h.n} (${Math.round(h.bad*100/h.n)}%)</td></tr>`).join("")}</tbody></table>`:""}`;
  $("fc").value = RF.col;
  let t; $("fn").oninput = e => { clearTimeout(t); t = setTimeout(() => { RF.name = e.target.value; resultsScreen().then(()=>{ const s=$("fn"); s.focus(); s.setSelectionRange(s.value.length,s.value.length); }); }, 300); };
  $("fc").onchange = e => { RF.col = e.target.value; resultsScreen(); };
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => attemptDetail(b.dataset.v));
  document.querySelectorAll("[data-x]").forEach(b => b.onclick = async () => { if (confirm("Удалить эту попытку из журнала?")){ await api("/api/admin/attempts/"+b.dataset.x,"DELETE"); resultsScreen(); } });
}
async function attemptDetail(id){
  const r = await api("/api/admin/attempts/" + id), a = r.attempt;
  $("app").innerHTML = `<div class="ed-top"><button id="back">← К результатам</button></div>
    <h2>${esc(a.name)}</h2><p class="note">${esc(a.col_title)} · ${fmtT(a.started)} · ${a.finished?`${a.score} из ${a.total}, ${mmss(a.seconds)}${a.timeout?", время вышло":""}`:"не завершён"}</p>
    ${r.items.map((x,i)=>`<div class="item${x.ok===false?" miss":""}"><p class="qq">${i+1}. ${esc(x.qid)} — ${esc(x.q)}</p>
      <p class="ans">Ответ: <b class="${x.ok?"ok":"bad"}">${x.chosen===null?"нет ответа":LET[x.chosen]+") "+esc(x.options[x.chosen])}</b></p>
      ${x.ok?"":`<p class="ans">Правильный: <b class="ok">${LET[x.correct]}) ${esc(x.options[x.correct])}</b></p>`}</div>`).join("")}`;
  $("back").onclick = resultsScreen;
}

/* ---------- замечания участников ---------- */
let CF = "new";
async function complaintsScreen(){
  const r = await api("/api/admin/complaints?status=" + CF);
  NEWC = r.counts.new; const b = document.querySelector('#tabs [data-t="c"]');
  if (b) b.innerHTML = "Замечания" + (NEWC ? ` <span class="badge">${NEWC}</span>` : "");
  const st = {deleted:"вопрос удалён", changed:"вопрос с тех пор изменён", same:""};
  $("app").innerHTML = `<h2>Замечания участников</h2>
    <p class="note">Участники оставляют их после теста к конкретному вопросу. Ниже вопрос показан так, как его видел участник (варианты в его порядке). Отметьте замечание рассмотренным, когда исправите вопрос или решите оставить как есть.</p>
    <div class="ed-top"><select id="cf"><option value="new">Новые (${r.counts.new})</option><option value="resolved">Рассмотренные (${r.counts.resolved})</option><option value="all">Все (${r.counts.new + r.counts.resolved})</option></select>
      <a href="/api/admin/complaints.csv"><button>Экспорт в CSV</button></a></div>
    ${r.items.length ? r.items.map(c => { const s = c.snap; return `<div class="item${c.status==="new"?" miss":""}">
      <p class="note" style="margin:0 0 6px">${fmtT(c.created)} · ${esc(s.name || "")} · вопрос <b>${esc(c.qid)}</b>${st[c.q_state] ? ` · <span class="badge">${st[c.q_state]}</span>` : ""}${c.status==="resolved" ? ` · <span class="badge">рассмотрено</span>` : ""}</p>
      <p class="ans"><b class="bad">${esc(c.kind_title)}</b></p>
      ${c.comment ? `<p class="ex" style="white-space:pre-wrap">«${esc(c.comment)}»</p>` : `<p class="note">Без описания.</p>`}
      <p class="qq" style="margin-top:10px">${esc(s.q)}</p>
      ${s.options.map((o,i) => `<p class="ans">${i===s.correct?"<b class=\"ok\">":""}${LET[i]}) ${esc(o)}${i===s.correct?" — правильный</b>":""}${i===s.chosen?" <span class=\"badge\">ответ участника</span>":""}</p>`).join("")}
      <p class="ref">${esc(s.act)}${s.pt ? ", " + esc(s.pt) : ""}</p>
      <div class="row" style="margin:8px 0 0">${c.q_state!=="deleted" ? `<button data-qe="${esc(c.qid)}">Открыть вопрос</button>` : ""}
        <button data-cs="${c.id}" data-to="${c.status==="new"?"resolved":"new"}">${c.status==="new"?"Отметить рассмотренным":"Вернуть в новые"}</button>
        ${isAdmin() ? `<button class="danger" data-cd="${c.id}">Удалить</button>` : ""}</div>
      ${c.status==="resolved" && c.handled_by ? `<p class="small" style="margin:6px 0 0">Рассмотрено: ${esc(c.handled_by)}, ${fmtT(c.handled_at)}</p>` : ""}</div>`; }).join("")
      : `<p class="note">${CF==="new" ? "Новых замечаний нет." : "Замечаний нет."}</p>`}`;
  $("cf").value = CF;
  $("cf").onchange = e => { CF = e.target.value; complaintsScreen(); };
  document.querySelectorAll("[data-qe]").forEach(b => b.onclick = () => qForm(b.dataset.qe, complaintsScreen));
  document.querySelectorAll("[data-cs]").forEach(b => b.onclick = async () => { await api("/api/admin/complaints/"+b.dataset.cs,"PUT",{status:b.dataset.to}); complaintsScreen(); });
  document.querySelectorAll("[data-cd]").forEach(b => b.onclick = async () => { if (confirm("Удалить замечание?")){ await api("/api/admin/complaints/"+b.dataset.cd,"DELETE"); complaintsScreen(); } });
}

gate();
</script>
</body>
</html>
